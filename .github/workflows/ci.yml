name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
        working-directory: Frontend
      - run: npm run lint
        working-directory: Frontend

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
        working-directory: Frontend
      # Catches import and syntax errors that unit tests never load.
      - run: npm run build
        working-directory: Frontend

  backend-unit:
    name: Backend unit (TZ ${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This app does its day-boundary maths in LOCAL time throughout
        # (calendarService.startOfDay, dailyTaskService, taskScopeService, every
        # isSameCalendarDay call). A suite that passes in only one offset hides a bug,
        # so the pure suite runs in three: UTC, the deployed offset, and a negative one.
        tz: ["UTC", "Asia/Kolkata", "America/Los_Angeles"]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
        working-directory: Backend
      # No database needed — this job stays fast on purpose.
      - run: npm run test:unit
        working-directory: Backend

  backend-integration:
    name: Backend integration
    runs-on: ubuntu-latest
    env:
      # The deployed offset, so integration runs against production's reality. The
      # date-boundary suite additionally sweeps the full matrix above.
      TZ: Asia/Kolkata
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      # Without this the ~590MB mongod binary is re-downloaded on every run, which
      # dwarfs the test time itself.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14-${{ runner.os }}
      - run: npm ci
        working-directory: Backend
      - run: npm test
        working-directory: Backend

  frontend-unit:
    name: Frontend unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
        working-directory: Frontend
      - run: npm test
        working-directory: Frontend

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [backend-integration, frontend-unit]
    env:
      TZ: Asia/Kolkata
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
      # Per-directory floors, enabled now that the Phase 1-5 suites have landed. The
      # floors are set to what is actually achieved and may only move up.
      COVERAGE_ENFORCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14-${{ runner.os }}
      - run: npm ci
        working-directory: Backend
      - run: npm ci
        working-directory: Frontend
      - run: npm run test:coverage
        working-directory: Backend
      - run: npm run test:coverage
        working-directory: Frontend
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            Backend/coverage/
            Frontend/coverage/
          retention-days: 14

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Scaffolded but not yet written (P3). Enable by removing this condition once
    # e2e/specs contains real specs.
    if: false
    needs: [backend-integration, frontend-unit]
    services:
      mongodb:
        image: mongo:7.0
        ports: ["27017:27017"]
    env:
      E2E_MONGODB_URI: mongodb://127.0.0.1:27017/progresstracker-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        working-directory: Backend
      - run: npm ci
        working-directory: Frontend
      - run: npm ci
      - run: npm run build --prefix Frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:seed
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/.report/
          retention-days: 7
